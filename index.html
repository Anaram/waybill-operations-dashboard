<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="پیش‌نمایش هشت صفحهٔ گزارش Power BI عملیات باربری با داده‌های ساختگی">
<title>داشبورد عملیات باربری | پیش‌نمایش Power BI</title>
<style>
:root{color-scheme:light;--ink:#1c2d3b;--navy:#142a3e;--gold:#b57d00;--paper:#f3f4f2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 "B Nazanin",Tahoma,sans-serif}
header{background:var(--navy);color:#fff;padding:22px max(20px,calc((100% - 1430px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:29px;margin:0;line-height:1.35}p{margin:2px 0 0}header p{color:#dce7ee}
a,button{font:inherit}a{color:inherit}.download{padding:6px 14px;border:1px solid #f2d381;border-radius:8px;color:#ffe4a8;text-decoration:none}
main{max-width:1470px;margin:auto;padding:18px 20px}
nav{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
button{color:var(--ink);background:#fff;border:1px solid #c8ced2;padding:5px 10px;border-radius:7px;cursor:pointer}
button[aria-current]{background:#f8e7af;border-color:var(--gold);font-weight:bold}
button:focus-visible,a:focus-visible{outline:3px solid #a26b00;outline-offset:3px}
figure{margin:0;background:white;border:1px solid #cfd7db;border-radius:10px;overflow:hidden}
figure a{display:block}img{display:block;width:100%;height:auto}
figcaption{padding:7px 12px;color:#4e606a}
</style>
</head>
<body>
<header>
<div><h1>داشبورد عملیات باربری</h1><p>پیش‌نمایش گزارش Power BI با داده‌های کاملاً ساختگی</p></div>
<a class="download" href="Waybill-Portfolio-Synthetic.pbix" download>دانلود فایل PBIX</a>
</header>
<main>
<nav id="pages" aria-label="صفحه‌های گزارش Power BI"></nav>
<figure>
<a id="full" href="screenshots/01-overview.png" aria-label="نمایش تصویر در اندازهٔ اصلی">
<img id="report" src="screenshots/01-overview.png" alt="صفحهٔ عملکرد کلی گزارش Power BI با مقایسهٔ آبان و مهر ۱۴۰۵" width="1430" height="803">
</a>
<figcaption id="caption" aria-live="polite">عملکرد کلی · برای استفاده از فیلترها، فایل PBIX را در Power BI Desktop باز کنید.</figcaption>
</figure>
</main>
<script>
const pages = [
  ['landing','ورود','05-landing.png'],
  ['calendar','تقویم','06-calendar.png'],
  ['overview','عملکرد کلی','01-overview.png'],
  ['geography','تحلیل جغرافیایی','02-geography.png'],
  ['province-waybills','نقشهٔ تعداد بارنامه','03-province-waybills.png'],
  ['province-commission','نقشهٔ کمیسیون','04-province-commission.png'],
  ['routes','پیمایش مسیر','07-routes.png'],
  ['details','عملکرد شعب و بارنامه‌ها','08-details.png']
];
const nav = document.getElementById('pages');
const report = document.getElementById('report');
const full = document.getElementById('full');
const caption = document.getElementById('caption');
for (const [id,title] of pages) {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = title;
  button.dataset.page = id;
  button.addEventListener('click', () => { location.hash = id; });
  nav.append(button);
}
function showPage() {
  const [id,title,file] = pages.find(page => page[0] === location.hash.slice(1)) || pages[2];
  const src = 'screenshots/' + file;
  report.src = src;
  report.alt = 'صفحهٔ ' + title + ' در گزارش Power BI با داده‌های ساختگی';
  full.href = src;
  caption.textContent = title + ' · برای استفاده از فیلترها، فایل PBIX را در Power BI Desktop باز کنید.';
  for (const button of nav.querySelectorAll('button')) {
    if (button.dataset.page === id) button.setAttribute('aria-current','page');
    else button.removeAttribute('aria-current');
  }
}
window.addEventListener('hashchange', showPage);
showPage();
</script>
</body>
</html>
